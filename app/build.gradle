plugins {
    id 'com.android.application'
}

android {
    namespace 'it.band.list'
    compileSdk 34

    defaultConfig {
        applicationId 'it.band.list'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
